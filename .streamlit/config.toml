[theme]
base = "dark"
primaryColor = "#e0a63c"
backgroundColor = "#141414"
secondaryBackgroundColor = "#1b1b1c"
textColor = "#ecebe8"
font = "sans serif"

[server]
headless = true
runOnSave = false
folderWatchBlacklist = [".venv", "venv", "data", "models", "outputs"]

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
