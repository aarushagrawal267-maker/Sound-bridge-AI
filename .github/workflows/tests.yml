name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

# The job only reads the repository, so the automatic GITHUB_TOKEN gets read access only.
permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false  # setup downloads third-party data; keep the token out of .git/config
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies (CPU-only PyTorch)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Build data and model artifacts (uses the committed encoder weights)
        run: python scripts/setup_all.py --reuse-weights
      - name: Run the test suite
        run: python -m pytest -q
